<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="980" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Stele file layout and commit protocol</title>
  <desc id="desc">A store file is an array of 4096-byte pages. Two meta pages hold the transaction id and root page. A commit writes new pages, syncs, then replaces one meta page and syncs again.</desc>

  <rect width="980" height="650" fill="#fbfaf7"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif" fill="#1f2328">
    <text x="40" y="46" font-size="23.5" font-weight="700">Stele: a file is an array of 4096-byte pages</text>
    <text x="40" y="70" font-size="15.1" fill="#57606a">Nothing is ever written in place. A transaction produces new pages; a commit swaps one meta page.</text>

    <!-- 1. the file -->
    <text x="40" y="110" font-size="13.4" font-weight="700" letter-spacing="1.4" fill="#57606a">1 · THE FILE</text>

    <g font-size="12.3">
      <!-- page boxes: x = 40 + i*112, width 100, y 126, height 56 -->
      <g>
        <rect x="40" y="126" width="100" height="56" rx="6" fill="#dbe8f6" stroke="#7aa7d9"/>
        <text x="90" y="146" text-anchor="middle" fill="#57606a">page 0</text>
        <text x="90" y="166" text-anchor="middle" font-size="14.0" font-weight="700">meta A</text>
      </g>
      <g>
        <rect x="152" y="126" width="100" height="56" rx="6" fill="#dbe8f6" stroke="#7aa7d9"/>
        <text x="202" y="146" text-anchor="middle" fill="#57606a">page 1</text>
        <text x="202" y="166" text-anchor="middle" font-size="14.0" font-weight="700">meta B</text>
      </g>
      <g>
        <rect x="264" y="126" width="100" height="56" rx="6" fill="#e9e1f5" stroke="#9b86c9"/>
        <text x="314" y="146" text-anchor="middle" fill="#57606a">page 2</text>
        <text x="314" y="166" text-anchor="middle" font-size="14.0" font-weight="700">branch</text>
      </g>
      <g>
        <rect x="376" y="126" width="100" height="56" rx="6" fill="#dcefe0" stroke="#7fb08c"/>
        <text x="426" y="146" text-anchor="middle" fill="#57606a">page 3</text>
        <text x="426" y="166" text-anchor="middle" font-size="14.0" font-weight="700">leaf</text>
      </g>
      <g>
        <rect x="488" y="126" width="100" height="56" rx="6" fill="#dcefe0" stroke="#7fb08c"/>
        <text x="538" y="146" text-anchor="middle" fill="#57606a">page 4</text>
        <text x="538" y="166" text-anchor="middle" font-size="14.0" font-weight="700">leaf</text>
      </g>
      <g>
        <rect x="600" y="126" width="100" height="56" rx="6" fill="#f2f2f0" stroke="#c9c9c4" stroke-dasharray="4 3"/>
        <text x="650" y="146" text-anchor="middle" fill="#57606a">page 5</text>
        <text x="650" y="166" text-anchor="middle" font-size="14.0" font-weight="700" fill="#57606a">free</text>
      </g>
      <g>
        <rect x="712" y="126" width="100" height="56" rx="6" fill="#f2f2f0" stroke="#c9c9c4" stroke-dasharray="4 3"/>
        <text x="762" y="146" text-anchor="middle" fill="#57606a">page 6</text>
        <text x="762" y="166" text-anchor="middle" font-size="14.0" font-weight="700" fill="#57606a">free</text>
      </g>
      <g>
        <rect x="824" y="126" width="100" height="56" rx="6" fill="none" stroke="#c9c9c4" stroke-dasharray="4 3"/>
        <text x="874" y="158" text-anchor="middle" font-size="14.6" fill="#8c959f">…</text>
      </g>
    </g>

    <text x="40" y="202" font-size="12.9" fill="#57606a">meta A: txid 7, root page 2</text>
    <text x="40" y="219" font-size="12.9" fill="#57606a">meta B: txid 6, root page 5</text>
    <text x="464" y="202" font-size="12.9" fill="#57606a">free pages wait on a list; the file only shrinks when trim() is called</text>

    <!-- 2. the commit -->
    <line x1="40" y1="228" x2="940" y2="228" stroke="#e4e1da"/>
    <text x="40" y="258" font-size="13.4" font-weight="700" letter-spacing="1.4" fill="#57606a">2 · A COMMIT, IN THREE STEPS</text>

    <!-- step cards -->
    <g>
      <rect x="40" y="274" width="278" height="132" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <circle cx="66" cy="300" r="13" fill="#1f2328"/>
      <text x="66" y="305" text-anchor="middle" font-size="14.0" font-weight="700" fill="#fbfaf7">1</text>
      <text x="88" y="305" font-size="15.1" font-weight="700">Write the new pages</text>
      <text x="58" y="332" font-size="13.4" fill="#57606a">the new leaves and the copies of</text>
      <text x="58" y="350" font-size="13.4" fill="#57606a">the path above them: pages 7, 8, 9</text>
      <text x="58" y="374" font-size="13.4" fill="#57606a">the old pages are untouched, so</text>
      <text x="58" y="392" font-size="13.4" fill="#57606a">meta A still opens the old tree</text>
    </g>
    <g>
      <rect x="351" y="274" width="278" height="132" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <circle cx="377" cy="300" r="13" fill="#1f2328"/>
      <text x="377" y="305" text-anchor="middle" font-size="14.0" font-weight="700" fill="#fbfaf7">2</text>
      <text x="399" y="305" font-size="15.1" font-weight="700">fsync</text>
      <text x="369" y="332" font-size="13.4" fill="#57606a">one call for the whole batch, before</text>
      <text x="369" y="350" font-size="13.4" fill="#57606a">any pointer can reach it</text>
      <text x="369" y="374" font-size="13.4" fill="#57606a">without this line, a crash could</text>
      <text x="369" y="392" font-size="13.4" fill="#57606a">publish a root that names garbage</text>
    </g>
    <g>
      <rect x="662" y="274" width="278" height="132" rx="8" fill="#ffffff" stroke="#d0d7de"/>
      <circle cx="688" cy="300" r="13" fill="#b45309"/>
      <text x="688" y="305" text-anchor="middle" font-size="14.0" font-weight="700" fill="#ffffff">3</text>
      <text x="710" y="305" font-size="15.1" font-weight="700">Replace one meta page</text>
      <text x="680" y="332" font-size="13.4" fill="#57606a">slot B: txid 8, root 7 -- one page,</text>
      <text x="680" y="350" font-size="13.4" fill="#57606a">one fsync, and the commit is done</text>
      <text x="680" y="374" font-size="13.4" fill="#57606a">meta A is still intact, one</text>
      <text x="680" y="392" font-size="13.4" fill="#57606a">transaction behind</text>
    </g>

    <g stroke="#b45309" stroke-width="1.6" fill="none">
      <path d="M322 340 L345 340" marker-end="url(#arrow)"/>
      <path d="M633 340 L656 340" marker-end="url(#arrow)"/>
    </g>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
      </marker>
    </defs>

    <!-- crash line -->
    <line x1="40" y1="432" x2="940" y2="432" stroke="#b42318" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="40" y="424" font-size="12.9" fill="#b42318">A crash anywhere above this line leads back to txid 7. After step 3, the same crash leads to txid 8.</text>

    <!-- 3. page format -->
    <text x="40" y="468" font-size="13.4" font-weight="700" letter-spacing="1.4" fill="#57606a">3 · ONE PAGE, NOT TO SCALE</text>

    <g font-size="13.4">
      <rect x="40" y="482" width="150" height="52" fill="#dbe8f6" stroke="#7aa7d9"/>
      <text x="115" y="505" text-anchor="middle" font-weight="700">header</text>
      <text x="115" y="523" text-anchor="middle" font-size="12.9" fill="#57606a">24 B</text>

      <rect x="190" y="482" width="190" height="52" fill="#eee7d7" stroke="#bda97c"/>
      <text x="285" y="505" text-anchor="middle" font-weight="700">slot array</text>
      <text x="285" y="523" text-anchor="middle" font-size="12.9" fill="#57606a">4 B per cell</text>

      <rect x="380" y="482" width="270" height="52" fill="#f2f2f0" stroke="#c9c9c4" stroke-dasharray="4 3"/>
      <text x="515" y="505" text-anchor="middle" font-size="12.9" fill="#57606a">free space, filled downwards</text>

      <rect x="650" y="482" width="290" height="52" fill="#dcefe0" stroke="#7fb08c"/>
      <text x="795" y="505" text-anchor="middle" font-weight="700">cells</text>
      <text x="795" y="523" text-anchor="middle" font-size="12.9" fill="#57606a">packed upwards from byte 4096</text>
    </g>

    <text x="40" y="562" font-size="12.9" fill="#57606a">header: kind · flags · nslots · start · end · leftmost · txid · crc32</text>
    <text x="40" y="582" font-size="12.9" fill="#57606a">the crc32 covers the whole page with its own four bytes set to zero, so a single flipped bit is caught on read</text>
    <text x="40" y="612" font-size="12.9" fill="#57606a">leaf cell: key length · value length · key · value</text>
    <text x="470" y="612" font-size="12.9" fill="#57606a">branch cell: key length · child page · key</text>
  </g>
</svg>
